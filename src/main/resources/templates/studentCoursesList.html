<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講コース一覧</title>
</head>

<body>
<h1>受講コース一覧</h1>

<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>名前</th>
      <th>受講コース名</th>
      <th>修了予定日</th>
    </tr>
  </thead>

  <tbody>
    <tr th:each="studentDetail : ${studentList}">
      <td th:text="${studentDetail.student.id}">1</td>
      <td th:text="${studentDetail.student.name}">名前</td>
      <td>
        <div
          th:each="course : ${studentDetail.studentsCourses}"
          th:text="${course.courseName}">
          コース名
        </div>
      </td>
      <td>
        <div
          th:each="course : ${studentDetail.studentsCourses}"
          th:text="${course.courseExpectedEndAt}">
          修了予定日
        </div>
      </td>
    </tr>
  </tbody>
</table>

</body>
</html>
